# Catalytix – tests, container image (GitHub Container Registry) and release zip
#
# push to main with a NEW version number (no release v<version> yet, higher than the latest release)
#                         → tests, image ghcr.io/<owner>/catalytix:<version> + :latest + :sha-<commit>,
#                           then the GitHub release v<version> with catalytix-<version>.zip and .sha256
# push to main, same version → tests and only :sha-<commit> – :latest and :<version> stay untouched, so servers
#                           that follow "latest" never get unreleased commits
# pull request            → tests and a test build of the image (nothing is pushed)
# every build             → Trivy scan of the image first; HIGH/CRITICAL vulnerabilities with a fix stop the run
#                           before anything is published (see .trivyignore for accepted exceptions)
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # publishes only when run on main (see "publish" below)

permissions:
  contents: read

concurrency:      # one run per branch at a time: two pushes never race to create the same release
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the pinned dependencies
        run: |
          python -m pip install pip==26.2.2
          pip install --no-deps --only-binary=:all: -r requirements.txt
          pip check

      - name: Check that all version numbers match
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catalytix/__init__.py)
          grep -q "org.opencontainers.image.version=\"$v\"" Dockerfile || { echo "::error::Dockerfile label is not $v"; exit 1; }
          grep -q "CATALYTIX_TAG:-$v}" docker-compose.yml || { echo "::error::docker-compose.yml default tag is not $v"; exit 1; }

      - name: Run the tests
        working-directory: tests
        run: python -m unittest discover -q

  image:
    name: Container image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      new: ${{ steps.meta.outputs.new }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name, version and what to publish
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          v="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catalytix/__init__.py)"
          publish=false; new=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            publish=true
            latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
            latest="${latest#v}"
            if gh release view "v$v" >/dev/null 2>&1; then
              echo "Release v$v exists – publishing only sha-${GITHUB_SHA::7}."
            elif [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -n1)" != "$v" ]; then
              echo "::warning::Version $v is lower than the latest release $latest – not publishing latest."
            else
              new=true
            fi
          fi
          {
            echo "version=$v"
            echo "publish=$publish"
            echo "new=$new"
            echo "tags<<EOF"
            echo "$image:sha-${GITHUB_SHA::7}"
            if [ "$new" = true ]; then echo "$image:$v"; echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Security check BEFORE anything is published: build the image once for amd64, scan it with Trivy and stop
      # if it contains a known HIGH or CRITICAL vulnerability that already has a fix (base image or Python
      # package). Unfixable findings (no patched version exists yet) don't block – they show up in the report.
      # Accepted exceptions go into .trivyignore with a reason and a date.
      - name: Build for the security scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: catalytix-scan:${{ github.sha }}
          cache-from: type=gha

      # Pinned to the full commit of the immutable release v0.36.0 (published after the supply chain attack of
      # March 2026, CVE-2026-33634) – never to a tag. The Trivy binary itself is pinned with "version".
      - name: Scan the image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.0
          image-ref: catalytix-scan:${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: json
          output: trivy.json
          exit-code: "1"

      - name: Scan report
        if: always()
        run: |
          [ -s trivy.json ] || exit 0
          python3 - <<'PY'
          import json, os
          data = json.load(open("trivy.json"))
          rows = []
          for res in data.get("Results") or []:
              for v in res.get("Vulnerabilities") or []:
                  rows.append((v.get("Severity", ""), v.get("VulnerabilityID", ""), v.get("PkgName", ""),
                               v.get("InstalledVersion", ""), v.get("FixedVersion", ""),
                               v.get("PkgPath") or res.get("Target", ""),
                               (v.get("Title") or "")[:90]))
              for s in res.get("Secrets") or []:
                  rows.append((s.get("Severity", ""), "secret:" + s.get("RuleID", ""), res.get("Target", ""),
                               "", "", "", (s.get("Title") or "")[:90]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Trivy: %d finding(s) – HIGH/CRITICAL with a fix available\n\n" % len(rows))
              if rows:
                  out.write("| Severity | ID | Package | Installed | Fixed in | Target | Title |\n|---|---|---|---|---|---|---|\n")
                  for r in rows:
                      out.write("| " + " | ".join(x.replace("|", "/") for x in r) + " |\n")
          if rows:   # one annotation with the complete list (annotations are visible without opening the log)
              print("::error title=Trivy: %d finding(s)::" % len(rows)
                    + "%0A".join("%s %s %s %s -> %s (%s)" % r[:6] for r in rows))
          PY

      - name: Build (and push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release zip
    needs: image
    if: needs.image.outputs.new == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build catalytix-<version>.zip and its checksum
        run: |
          v="${{ needs.image.outputs.version }}"
          git archive --format=zip --prefix=catalytix/ -o "catalytix-$v.zip" HEAD
          sha256sum "catalytix-$v.zip" > "catalytix-$v.zip.sha256"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.image.outputs.version }}"
          gh release view "v$v" >/dev/null 2>&1 && { echo "Release v$v exists already."; exit 0; }
          gh release create "v$v" "catalytix-$v.zip" "catalytix-$v.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Catalytix $v" \
            --notes "Update with the image built by GitHub: \`./update.sh --pull\` – or classically with this package: \`./update.sh catalytix-$v.zip\` (put the .sha256 file next to it). Changes: see CHANGELOG.md."
