# Catalytix – tests, container image (GitHub Container Registry) and release zip
#
# push to main            → tests, then image ghcr.io/<owner>/catalytix:<version>, :latest, :sha-<commit>;
#                           for a new version number also a GitHub release v<version> with
#                           catalytix-<version>.zip and .sha256 (the tag is created automatically)
# push a tag v<version>   → the same for that tag (must match __version__ in catalytix/__init__.py)
# pull request            → tests and a test build of the image (nothing is pushed)
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the pinned dependencies
        run: |
          python -m pip install pip==26.2.2
          pip install --no-deps --only-binary=:all: -r requirements.txt
          pip check

      - name: Check that all version numbers match
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catalytix/__init__.py)
          grep -q "org.opencontainers.image.version=\"$v\"" Dockerfile || { echo "::error::Dockerfile label is not $v"; exit 1; }
          grep -q "CATALYTIX_TAG:-$v}" docker-compose.yml || { echo "::error::docker-compose.yml default tag is not $v"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match version $v"; exit 1
          fi

      - name: Run the tests
        working-directory: tests
        run: python -m unittest discover -q

  image:
    name: Container image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catalytix/__init__.py)" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release zip
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Is there already a release for this version?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catalytix/__init__.py)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v exists – nothing to do."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build catalytix-<version>.zip and its checksum
        if: steps.check.outputs.create == 'true'
        run: |
          v="${{ steps.check.outputs.version }}"
          git archive --format=zip --prefix=catalytix/ -o "catalytix-$v.zip" HEAD
          sha256sum "catalytix-$v.zip" > "catalytix-$v.zip.sha256"

      - name: Create the GitHub release
        if: steps.check.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.check.outputs.version }}"
          gh release create "v$v" "catalytix-$v.zip" "catalytix-$v.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Catalytix $v" \
            --notes "Update with the image built by GitHub: \`./update.sh --pull\` – or classically with this package: \`./update.sh catalytix-$v.zip\` (put the .sha256 file next to it). Changes: see CHANGELOG.md."
