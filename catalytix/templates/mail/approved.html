{% extends "mail/_layout.html" %}
{% block content %}
<p style="margin:0 0 12px;">{{ _("Hallo {name},", name=user.name) }}</p>
<p style="margin:0 0 12px;">{{ _("dein Konto wurde freigegeben. Du kannst dich jetzt mit dem Benutzernamen <b>{username}</b> anmelden.", username=user.username) }}</p>
{% if link %}<p style="margin:20px 0;"><a href="{{ link }}" style="background:{{ mail_accent }};color:{{ mail_accent_ink }};padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600;display:inline-block;">{{ _("Zur Anmeldung") }}</a></p>{% endif %}
{% endblock %}
