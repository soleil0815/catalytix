# Type checking with mypy – introduced step by step (see README, "Tests").
#
# mypy.ini (this file): MUST pass. Everything is lenient (ignore_errors) except the modules listed below, which are
#   checked strictly. Each audit / version adds a few modules to that list until everything is covered.
# mypy-report.ini: checks ALL modules and only lists the findings (CI step summary) – it never fails the run.
#
# Run locally:  python -m mypy                      (strict modules, must show "Success")
#               python -m mypy --config-file mypy-report.ini   (full list)

[mypy]
python_version = 3.13
files = catalytix, tools
ignore_missing_imports = True
ignore_errors = True
warn_unused_configs = True
# tools/ has no __init__.py – with this its modules are called tools.lock, tools.trivy_scan, …
explicit_package_bases = True

# ---- strict: errors here cause the most damage (backups, build chain, network zones, proxy, permissions)
[mypy-catalytix.backup,catalytix.netzone,catalytix.proxy,catalytix.models,tools.*]
ignore_errors = False
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_any_generics = True
warn_return_any = True
warn_unused_ignores = True
strict_optional = True
no_implicit_optional = True
strict_equality = True
