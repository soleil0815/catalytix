# Weekly rebuild of the latest release – every Monday, automatically.
#
# Builds the code of the latest GitHub release (tag v<version>, never unreleased commits from main) again with the
# current Debian security updates, runs the tests, scans the image with Trivy and – only if everything passes –
# publishes it as ghcr.io/<owner>/catalytix:latest (plus :<version>-r<date> and :sha-<commit>). The tag
# :<version> itself stays the image of the release.
#
# Python packages stay exactly as pinned in requirements.txt: if Trivy finds a vulnerable Python package, the run
# fails and nothing is published (GitHub sends an email) – that needs a new version with the updated package.
name: Weekly rebuild

on:
  schedule:
    - cron: "17 5 * * 1"     # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:                  # never at the same time as a release build on main (same group as build.yml)
  group: publish-refs/heads/main
  cancel-in-progress: false

jobs:
  release:
    name: Latest release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      version: ${{ steps.rel.outputs.version }}
    steps:
      - name: Find the latest release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No release found ($tag)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Rebuilding $tag"

  test:
    name: Tests
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the pinned dependencies
        run: |
          python -m pip install pip==26.2.2
          pip install --no-deps --only-binary=:all: -r requirements.txt
          pip check

      - name: Run the tests
        working-directory: tests
        run: python -m unittest discover -q

  image:
    name: Rebuild, scan and publish
    needs: [release, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          v="${{ needs.release.outputs.version }}"
          sha="$(git rev-parse --short=7 HEAD)"
          {
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:latest"
            echo "$image:$v-r$(date -u +%Y%m%d)"
            echo "$image:sha-$sha"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # no-cache: the Debian security updates must really be fetched again
      - name: Build for the security scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          no-cache: true
          pull: true
          build-args: OS_UPDATES=1
          tags: catalytix-scan:weekly

      # Pinned to the full commit of the immutable release v0.36.0 (supply chain attack March 2026, CVE-2026-33634)
      - name: Scan the image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.0
          image-ref: catalytix-scan:weekly
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: json
          output: trivy.json
          exit-code: "1"

      - name: Scan report
        if: always()
        run: |
          [ -s trivy.json ] || exit 0
          python3 - <<'PY'
          import json, os
          data = json.load(open("trivy.json"))
          rows = []
          for res in data.get("Results") or []:
              for v in res.get("Vulnerabilities") or []:
                  rows.append((v.get("Severity", ""), v.get("VulnerabilityID", ""), v.get("PkgName", ""),
                               v.get("InstalledVersion", ""), v.get("FixedVersion", ""),
                               v.get("PkgPath") or res.get("Target", ""),
                               (v.get("Title") or "")[:90]))
              for s in res.get("Secrets") or []:
                  rows.append((s.get("Severity", ""), "secret:" + s.get("RuleID", ""), res.get("Target", ""),
                               "", "", "", (s.get("Title") or "")[:90]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Trivy: %d finding(s) – HIGH/CRITICAL with a fix available\n\n" % len(rows))
              if rows:
                  out.write("| Severity | ID | Package | Installed | Fixed in | Target | Title |\n|---|---|---|---|---|---|---|\n")
                  for r in rows:
                      out.write("| " + " | ".join(x.replace("|", "/") for x in r) + " |\n")
          if rows:   # one annotation with the complete list (annotations are visible without opening the log)
              print("::error title=Trivy: %d finding(s)::" % len(rows)
                    + "%0A".join("%s %s %s %s -> %s (%s)" % r[:6] for r in rows))
          PY

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The scanned amd64 layers are reused from the local build; arm64 is built with the same updates
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: OS_UPDATES=1
          tags: ${{ steps.meta.outputs.tags }}
