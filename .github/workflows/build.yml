# Program release: tests, container image (GitHub Container Registry) and release zip.
#
# push to main             → check locks, build the image WITHOUT cache, run the tests IN the image, Trivy scan.
#   with a NEW version     → only then: publish ghcr.io/<owner>/catalytix:<version> (+ :latest if it is the highest
#                            version) and the GitHub release v<version> with catalytix-<version>.zip and .sha256.
#                            Published versions are never overwritten.
# pull request             → the same checks, nothing is published.
#
# Security of this workflow: actions pinned to full commit SHAs, minimal permissions per job, no Git credentials
# stored in the checkout, publishing only from main, never two publishing runs at the same time (shared with the
# weekly security update), Trivy is NOT used as a GitHub action (see tools/trivy_scan.py).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}   # the security update (security-update.yml) uses publish-refs/heads/main, too
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build, test and scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check locks, version numbers and .trivyignore
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/lock.py check || { echo "::error title=Locks incomplete::See 'lock check' lines in the log – run tools/lock.py update."; exit 1; }
          python3 tools/trivy_scan.py check-ignore
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catalytix/__init__.py)
          grep -q "org.opencontainers.image.version=\"$v\"" Dockerfile || { echo "::error title=Version mismatch::Dockerfile label is not $v"; exit 1; }
          grep -q "CATALYTIX_TAG:-$v}" docker-compose.yml || { echo "::error title=Version mismatch::docker-compose.yml default tag is not $v"; exit 1; }
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          new=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ] \
             && ! gh release view "v$v" >/dev/null 2>&1; then
            if [ -z "$latest" ] || python3 tools/security_update.py is-highest "$v" "${latest#v}"; then
              new=true
            else
              echo "::warning title=Not published::Version $v is lower than the latest release ${latest} – nothing is published."
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Version $v – new release: $new"

      - name: Prepare Docker
        run: |
          docker buildx create --name ci --driver docker-container --use >/dev/null
          docker buildx inspect --bootstrap >/dev/null

      - name: Build the image (without cache)
        run: |
          docker buildx build --no-cache --pull --platform linux/amd64 --load -t catalytix-ci:check . \
            || { echo "::error title=Image build failed::See the log of this step."; exit 1; }

      # The tests run in exactly the image that gets published (its Python and packages) with the code of this
      # checkout mounted – the same code that is in the image.
      - name: Run the tests in the image
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint python -e CATALYTIX_DATA_DIR=/tmp/catalytix-test \
            -v "$PWD:/src" -w /src/tests catalytix-ci:check -m unittest discover -q \
            || { echo "::error title=Tests failed in the image::See the log of this step – nothing is published."; exit 1; }
          { echo "### Packages in the image"; echo '```'
            docker run --rm --entrypoint cat catalytix-ci:check /app/image-packages.txt | grep -v '^deb '
            echo "($(docker run --rm --entrypoint cat catalytix-ci:check /app/image-packages.txt | grep -c '^deb ') Debian packages)"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Security scan (Trivy)
        run: |
          python3 tools/trivy_scan.py install
          python3 tools/trivy_scan.py scan catalytix-ci:check

  publish:
    name: Publish image
    needs: check
    if: needs.check.outputs.new == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Docker (amd64 + arm64)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static >/dev/null
          docker buildx create --name ci --driver docker-container --use >/dev/null
          docker buildx inspect --bootstrap >/dev/null

      - name: Log in to the GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish (never overwrite a version)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
            echo "::error title=Version already published::$image:$VERSION exists – published versions are never overwritten. Raise the version number."
            exit 1
          fi
          # Same locked inputs as the tested image (base image digest, Debian snapshot, hashed packages)
          docker buildx build --no-cache --pull --platform linux/amd64,linux/arm64 --push \
            -t "$image:$VERSION" -t "$image:latest" -t "$image:sha-${GITHUB_SHA::7}" . \
            || { echo "::error title=Publishing failed::See the log of this step."; exit 1; }
          echo "Published $image:$VERSION and :latest"

      - name: Log out
        if: always()
        run: docker logout ghcr.io

  release:
    name: Release zip
    needs: [check, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build catalytix-<version>.zip and its checksum
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git archive --format=zip --prefix=catalytix/ -o "catalytix-$VERSION.zip" HEAD
          sha256sum "catalytix-$VERSION.zip" > "catalytix-$VERSION.zip.sha256"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 && { echo "Release v$VERSION exists already."; exit 0; }
          gh release create "v$VERSION" "catalytix-$VERSION.zip" "catalytix-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Catalytix $VERSION" \
            --notes "Update with the image built by GitHub: \`./update.sh --pull\` – or classically with this package: \`./update.sh catalytix-$VERSION.zip\` (put the .sha256 file next to it). Changes: see CHANGELOG.md."
