# Weekly security scan of the published image (ghcr.io/<owner>/catalytix:latest).
# New vulnerabilities are found after a release, too: if this run fails, GitHub notifies the repository owner by
# email – then publish a new version (updated base image / packages), which is scanned again before release.
name: Security scan

on:
  schedule:
    - cron: "17 5 * * 1"     # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  scan:
    name: Trivy scan of :latest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      # Same pinning as in build.yml (full commit of the immutable release v0.36.0, CVE-2026-33634)
      - name: Scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ steps.meta.outputs.image }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: json
          output: trivy.json
          exit-code: "1"

      - name: Scan report
        if: always()
        run: |
          [ -s trivy.json ] || exit 0
          python3 - <<'PY'
          import json, os
          data = json.load(open("trivy.json"))
          rows = []
          for res in data.get("Results") or []:
              for v in res.get("Vulnerabilities") or []:
                  rows.append((v.get("Severity", ""), v.get("VulnerabilityID", ""), v.get("PkgName", ""),
                               v.get("InstalledVersion", ""), v.get("FixedVersion", ""),
                               v.get("PkgPath") or res.get("Target", ""),
                               (v.get("Title") or "")[:90]))
              for s in res.get("Secrets") or []:
                  rows.append((s.get("Severity", ""), "secret:" + s.get("RuleID", ""), res.get("Target", ""),
                               "", "", "", (s.get("Title") or "")[:90]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Trivy: %d finding(s) – HIGH/CRITICAL with a fix available\n\n" % len(rows))
              if rows:
                  out.write("| Severity | ID | Package | Installed | Fixed in | Target | Title |\n|---|---|---|---|---|---|---|\n")
                  for r in rows:
                      out.write("| " + " | ".join(x.replace("|", "/") for x in r) + " |\n")
          if rows:   # one annotation with the complete list (annotations are visible without opening the log)
              print("::error title=Trivy: %d finding(s)::" % len(rows)
                    + "%0A".join("%s %s %s %s -> %s (%s)" % r[:6] for r in rows))
          PY
