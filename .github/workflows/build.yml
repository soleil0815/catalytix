# Program release: tests, container image (GitHub Container Registry) and the GitHub release.
#
# pull request / push to main → check the locks, build the image WITHOUT cache, run the tests IN the image, Trivy.
#   Nothing is published – a merged pull request only gets checked.
# Publishing ONLY by hand: Actions → Build → Run workflow (branch main) with "publish" ticked, and only for a NEW
#   version (higher than every release). Then: build amd64 + arm64 once without cache, test (amd64) and scan (both)
#   exactly these images, push them as :<version> (+ :sha-…), move :latest, and create the release v<version> with
#   the image files for installing without internet (catalytix-<version>-amd64.tar.gz / -arm64.tar.gz), SHA256SUMS,
#   update.sh, docker-compose.yml and .env.example. Published versions are never overwritten.
#
# Security: actions pinned to full commit SHAs, permissions: {} by default and minimal per job, no Git credentials
# stored in the checkout, publishing only from main and never at the same time as another publishing job
# (concurrency group "publish", shared with the weekly security update), Trivy NOT as a GitHub action
# (see tools/trivy_scan.py), helpers with readable errors in tools/ci.sh.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this version (image :<version> and :latest, GitHub release)"
        type: boolean
        default: false

permissions: {}

# Explicit bash: GitHub then runs every step with "bash -eo pipefail" – without it a failing command in a pipe
# (e.g. the tests piped into tee) would go unnoticed.
defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build, test and scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check locks, version numbers and .trivyignore
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: |
          . tools/ci.sh
          python3 tools/lock.py check || fail "Locks incomplete" "See the 'lock check' lines in the log – run tools/lock.py update."
          python3 tools/trivy_scan.py check-ignore
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catalytix/__init__.py)
          grep -q "org.opencontainers.image.version=\"$v\"" Dockerfile || fail "Version mismatch" "Dockerfile label is not $v"
          cv="$(sed -n 's/^ *CATALYTIX_COMPOSE: *"\([0-9]*\)".*/\1/p' docker-compose.yml)"
          grep -q "catalytix.compose=\"$cv\"" Dockerfile || fail "Compose version mismatch" "Dockerfile label catalytix.compose is not $cv"
          new=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$PUBLISH" = true ] && [ "$GITHUB_REF" = refs/heads/main ] \
             && ! release_exists "$v"; then
            highest="$(highest_release)"
            if [ -z "$highest" ] || python3 tools/security_update.py is-highest "$v" "$highest"; then
              new=true
            else
              echo "::warning title=Not published::Version $v is lower than the highest release $highest – nothing is published."
            fi
          fi
          if [ "$new" = false ] && [ "$GITHUB_EVENT_NAME" = push ] && ! release_exists "$v"; then
            echo "::notice title=Not published yet::Version $v is checked. Publish it with Actions → Build → Run workflow (main, tick publish)."
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Version $v – publish now: $new"

      - name: Prepare Docker
        run: . tools/ci.sh && prepare_builder

      - name: Build the image (without cache)
        run: |
          . tools/ci.sh
          docker buildx build --no-cache --pull --platform linux/amd64 --load -t catalytix-ci:check . \
            || fail "Image build failed" "See the log of this step."

      - name: Run the tests in the image
        run: . tools/ci.sh && test_in_image catalytix-ci:check "$PWD"

      - name: Security scan (Trivy)
        run: |
          python3 tools/trivy_scan.py install
          python3 tools/trivy_scan.py scan catalytix-ci:check

  publish:
    name: Build, check and publish both platforms
    needs: check
    if: needs.check.outputs.new == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Already published?
        id: state
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          . tools/ci.sh
          docker_login
          if image_exists "$(image_name):$VERSION"; then
            echo "::notice title=Image already published::$(image_name):$VERSION exists and is never overwritten – only the release is created."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Docker (amd64 + arm64)
        if: steps.state.outputs.published == 'false'
        run: . tools/ci.sh && prepare_builder multi

      # One build without cache for both platforms; the steps below load and push exactly these layers.
      - name: Build both platforms (without cache)
        if: steps.state.outputs.published == 'false'
        run: |
          . tools/ci.sh
          docker buildx build --no-cache --pull --platform linux/amd64,linux/arm64 . \
            || fail "Image build failed" "See the log of this step – nothing is published."
          docker buildx build --platform linux/amd64 --load -t catalytix-ci:amd64 .
          docker buildx build --platform linux/arm64 --load -t catalytix-ci:arm64 .

      - name: Run the tests in the image (amd64)
        if: steps.state.outputs.published == 'false'
        run: . tools/ci.sh && test_in_image catalytix-ci:amd64 "$PWD"

      - name: Security scan of both platforms (Trivy)
        if: steps.state.outputs.published == 'false'
        run: |
          python3 tools/trivy_scan.py install
          python3 tools/trivy_scan.py scan catalytix-ci:amd64
          python3 tools/trivy_scan.py scan catalytix-ci:arm64

      - name: Publish
        if: steps.state.outputs.published == 'false'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          . tools/ci.sh
          image="$(image_name)"
          ! image_exists "$image:$VERSION" || fail "Version already published" "$image:$VERSION appeared meanwhile – never overwritten."
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$image:$VERSION" -t "$image:sha-${GITHUB_SHA::7}" . \
            || fail "Publishing failed" "See the log of this step."
          highest="$(highest_release)"
          if [ -z "$highest" ] || python3 tools/security_update.py is-highest "$VERSION" "$highest"; then
            docker buildx imagetools create -t "$image:latest" "$image:$VERSION" || fail "Publishing failed" "Could not move :latest."
          fi
          echo "### Published $image:$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout ghcr.io

  release:
    name: GitHub release (image files, update.sh, docker-compose.yml)
    needs: [check, publish]
    runs-on: ubuntu-24.04
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Exactly the published images (pulled back from the registry), for installing without internet:
      # docker load -i catalytix-<version>-<arch>.tar.gz  (or: ./update.sh --load <file>)
      - name: Image files and checksums
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . tools/ci.sh
          docker_login
          image="$(image_name)"
          mkdir -p assets
          for arch in amd64 arm64; do
            docker pull -q --platform "linux/$arch" "$image:$VERSION" >/dev/null \
              || fail "Image not available" "Could not pull $image:$VERSION for $arch."
            got="$(docker image inspect -f '{{.Architecture}}' "$image:$VERSION")"
            [ "$got" = "$arch" ] || fail "Wrong platform" "Expected $arch, got $got."
            docker save "$image:$VERSION" | gzip -6 > "assets/catalytix-$VERSION-$arch.tar.gz"
            docker image rm "$image:$VERSION" >/dev/null
          done
          docker logout ghcr.io >/dev/null
          cp update.sh docker-compose.yml .env.example assets/
          mv assets/.env.example assets/env.example     # release assets cannot start with a dot
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -l assets

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          . tools/ci.sh
          if release_exists "$VERSION"; then echo "Release v$VERSION exists already."; exit 0; fi
          cat > notes.md <<EOF
          Installation and updates: see README. In short:
          - New: download docker-compose.yml and env.example (save it as .env), then \`docker compose up -d\`.
          - Update: container manager (Dockhand, Watchtower …), \`docker compose pull && docker compose up -d\`, or \`./update.sh\` (with automatic way back).
          - Without internet: \`./update.sh --load catalytix-$VERSION-amd64.tar.gz\` (arm64 for ARM), checked against SHA256SUMS.
          - Installations from before 3.0.0: run your old \`./update.sh --pull\` once, then \`./update.sh --cleanup\`.

          Changes: see CHANGELOG.md.
          EOF
          gh release create "v$VERSION" assets/* \
            --target "$GITHUB_SHA" \
            --title "Catalytix $VERSION" \
            --notes-file notes.md \
            || fail "Release failed" "Could not create release v$VERSION."
