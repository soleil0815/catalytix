# Weekly security update – Mondays early, automatically; can also be started by hand (Actions → Security update →
# Run workflow).
#
# update  1. Code of the highest release (tag v<version>; never unreleased commits from main).
#         2. tools/lock.py update: newest base image, Debian packages and Python packages – only INSIDE the foundation
#            (Debian 13 "trixie", Python 3.13, every package within its major version, calendar versions like
#            certifi without limit, new releases only after <cooldown> days).
#         3. One build without cache for amd64 and arm64 (all Debian packages, also those of the base image, brought
#            to the locked archive state; pip removed from the finished image).
#         4. Compare the package list with the published :latest – nothing changed: nothing happens.
#         5. Tests IN the new image (amd64), Trivy scan of both platforms.
#         6. Only if everything passed: push exactly these images as <version>-s<counter> (e.g. 2.19.0-s1; a new
#            program version starts again at s1). The tag is chosen before the build and baked into the image
#            (label catalytix.tag, plus the release commit as org.opencontainers.image.revision) – update.sh goes
#            back to exactly this tag. Published tags are never overwritten.
# record  7. New locks and a change log entry (list of changed packages) on main.
# promote 8. Move :latest to the new security update (only if its version is the highest and :latest does not
#            already point to a higher version).
# One run at a time (workflow-level concurrency; build.yml has its own – a job-level group shared by both let GitHub
# cancel waiting jobs, e.g. the record job of a run whose image was already pushed).
# If something fails, nothing more is published; GitHub sends an email and the cause is shown on the run.
name: Security update

on:
  schedule:
    - cron: "17 4 * * 1"          # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      cooldown_days:
        description: "Only take package releases at least this many days old (0 = also brand-new security fixes)"
        default: "7"
        required: true

permissions: {}

concurrency:
  group: security-update
  cancel-in-progress: false

# Explicit bash: GitHub then runs every step with "bash -eo pipefail" – without it a failing command in a pipe
# (e.g. the tests piped into tee) would go unnoticed.
defaults:
  run:
    shell: bash

jobs:
  update:
    name: Update, build, test, scan, push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.release.outputs.version }}
      main_sha: ${{ steps.release.outputs.main_sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Highest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . tools/ci.sh
          v="$(highest_release)"
          [ -n "$v" ] || fail "No release" "There is no release yet – publish a program version first."
          git worktree add --detach release "v$v" >/dev/null || fail "No release" "Tag v$v not found."
          python3 tools/lock.py same-build release . || exit 1
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Security update for v$v"

      - name: Prepare Docker (amd64 + arm64)
        run: . tools/ci.sh && prepare_builder multi

      - name: Fix newer versions (inside the foundation)
        env:
          COOLDOWN: ${{ github.event.inputs.cooldown_days || '7' }}
        run: |
          . tools/ci.sh
          [[ "$COOLDOWN" =~ ^[0-9]+$ ]] || fail "Invalid input" "cooldown_days must be a number."
          python3 tools/lock.py copy-locks . release
          python3 release/tools/lock.py update --cooldown-days "$COOLDOWN" --report lock-report.json \
            || fail "Locking failed" "Newer versions could not be determined (see log) – nothing is published."
          python3 release/tools/lock.py check || fail "Locking failed" "The new locks are incomplete."

      # The tag goes into the image (label catalytix.tag), so it is chosen before the build
      - name: Choose the tag
        id: tag
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          . tools/ci.sh
          docker_login
          image="$(image_name)"
          tag="$(python3 tools/security_update.py next-tag "$VERSION")"
          while image_exists "$image:$tag"; do n="${tag##*-s}"; tag="$VERSION-s$((n + 1))"; done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$(git -C release rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"

      # amd64 first, without cache (fresh builder of this run): enough to see whether anything changed. arm64 (emulated,
      # by far the slowest part) is only built when something changed – most weeks nothing does (CI minutes).
      - name: Build amd64 (without cache)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REVISION: ${{ steps.tag.outputs.revision }}
        run: |
          . tools/ci.sh
          docker buildx build --no-cache --pull --build-arg "CATALYTIX_TAG=$TAG" --build-arg "CATALYTIX_REVISION=$REVISION" \
            --platform linux/amd64 --load -t catalytix-ci:amd64 release \
            || fail "Image build failed" "See the log of this step – nothing is published."

      - name: Compare with the published image
        id: compare
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . tools/ci.sh
          docker_login
          image="$(image_name)"
          docker run --rm --entrypoint cat catalytix-ci:amd64 /app/image-packages.txt > new-packages.txt
          : > old-packages.txt
          if image_exists "$image:latest"; then
            docker pull -q "$image:latest" >/dev/null || fail "Image not available" "Could not pull $image:latest."
            # images from before 2.19.0 have no package list – then the change log says so
            docker run --rm --entrypoint sh "$image:latest" -c \
              'if [ -f /app/image-packages.txt ]; then cat /app/image-packages.txt; fi' > old-packages.txt
          fi
          set +e
          python3 tools/security_update.py diff old-packages.txt new-packages.txt > changes.txt
          rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### Security update: nothing changed – nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing changed."
            exit 0
          fi
          [ "$rc" = 0 ] || fail "Comparison failed" "See the log of this step."
          echo "changed=true" >> "$GITHUB_OUTPUT"
          { echo "### Changed packages"; head -c 60000 changes.txt; } >> "$GITHUB_STEP_SUMMARY"

      # Same builder: amd64 comes from the layers built above (exactly the image that was compared and gets tested),
      # arm64 is built now – also without any older cache.
      - name: Build arm64
        if: steps.compare.outputs.changed == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REVISION: ${{ steps.tag.outputs.revision }}
        run: |
          . tools/ci.sh
          args=(--build-arg "CATALYTIX_TAG=$TAG" --build-arg "CATALYTIX_REVISION=$REVISION")
          docker buildx build "${args[@]}" --platform linux/amd64,linux/arm64 release \
            || fail "Image build failed" "See the log of this step – nothing is published."
          docker buildx build "${args[@]}" --platform linux/arm64 --load -t catalytix-ci:arm64 release

      - name: Run the tests in the new image (amd64)
        if: steps.compare.outputs.changed == 'true'
        run: . tools/ci.sh && test_in_image catalytix-ci:amd64 "$PWD/release"

      - name: Security scan of both platforms (Trivy)
        if: steps.compare.outputs.changed == 'true'
        run: |
          python3 tools/trivy_scan.py install
          python3 tools/trivy_scan.py scan catalytix-ci:amd64
          python3 tools/trivy_scan.py scan catalytix-ci:arm64

      - name: Push the security update (never overwrite)
        id: push
        if: steps.compare.outputs.changed == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REVISION: ${{ steps.tag.outputs.revision }}
        run: |
          . tools/ci.sh
          image="$(image_name)"
          ! image_exists "$image:$TAG" || fail "Tag taken meanwhile" "$image:$TAG appeared during the run – never overwritten. Start the security update again."
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg "CATALYTIX_TAG=$TAG" --build-arg "CATALYTIX_REVISION=$REVISION" -t "$image:$TAG" release \
            || fail "Publishing failed" "See the log of this step."
          echo "### Pushed $image:$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Hand over the new locks
        if: steps.compare.outputs.changed == 'true'
        run: |
          mkdir -p handover/docker
          cp release/Dockerfile release/requirements.txt handover/
          cp release/docker/pip.lock handover/docker/
          cp old-packages.txt new-packages.txt handover/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: steps.compare.outputs.changed == 'true'
        with:
          name: security-update
          path: handover/
          retention-days: 7
          include-hidden-files: false

      - name: Log out
        if: always()
        run: docker logout ghcr.io

  record:
    name: Change log and locks on main
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: security-update
          path: handover

      - name: Commit to main
        env:
          MAIN_SHA: ${{ needs.update.outputs.main_sha }}
          VERSION: ${{ needs.update.outputs.version }}
          TAG: ${{ needs.update.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . tools/ci.sh
          remote="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" || fail "GitHub API not reachable" "Could not read main."
          [ "$remote" = "$MAIN_SHA" ] || fail "main changed during the run" \
            "$TAG is published, but main moved – start the security update again to record it (the next run skips taken numbers)."
          python3 tools/lock.py copy-locks handover .
          python3 tools/security_update.py changelog "$TAG" "$VERSION" handover/old-packages.txt handover/new-packages.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile requirements.txt docker/pip.lock CHANGELOG.md CHANGELOG.en.md
          git commit -q -m "Security update $TAG: updated packages for $VERSION"
          git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main \
            || fail "Could not update main" "main changed in the meantime – start the security update again."

  promote:
    name: Move latest
    needs: [update, record]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Point latest to the security update
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.update.outputs.version }}
          TAG: ${{ needs.update.outputs.tag }}
        run: |
          . tools/ci.sh
          highest="$(highest_release)"
          python3 tools/security_update.py is-highest "$VERSION" "$highest" \
            || fail "Not the highest version" "$VERSION is lower than $highest – :latest stays."
          docker_login
          latest_allows "$VERSION" \
            || fail "Not the highest version" ":latest already points to a version higher than $VERSION – :latest stays."
          docker buildx imagetools create -t "$(image_name):latest" "$(image_name):$TAG" \
            || fail "Publishing failed" "Could not move :latest."
          docker logout ghcr.io >/dev/null
          echo "### $(image_name):latest → $TAG" >> "$GITHUB_STEP_SUMMARY"
