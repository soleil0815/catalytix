# Program release: tests, container image (GitHub Container Registry) and the GitHub release.
#
# pull request → check the locks, build the image WITHOUT cache, run the tests IN the image, Trivy – amd64 and
#   arm64 at the same time, each on its own runner.
#   Nothing is published – a merged pull request only gets checked.
# Publishing ONLY by hand: Actions → Build → Run workflow (branch main) with "publish" ticked, and only for a NEW
#   version (higher than every release). Then: build amd64 and arm64 at the same time, each natively on its own
#   runner (ubuntu-24.04 / ubuntu-24.04-arm, no emulation) and without cache, run tests, start check and Trivy on
#   each, push exactly these images (by digest), tag both together as :<version> (+ :sha-…) only when both passed,
#   move :latest, and create the release v<version> with
#   the image files for installing without internet (catalytix-<version>-amd64.tar.gz / -arm64.tar.gz), SHA256SUMS,
#   update.sh, docker-compose.yml and .env.example. Published versions are never overwritten.
#
# Security: actions pinned to full commit SHAs, permissions: {} by default and minimal per job, no Git credentials
# stored in the checkout, publishing only from main, one publishing run at a time (workflow-level concurrency; the
# weekly security update has its own – a job-level group shared by both let GitHub cancel waiting jobs),
# :latest never moved to a lower version (checked against the releases AND the image :latest points to), Trivy NOT
# as a GitHub action (see tools/trivy_scan.py), helpers with readable errors in tools/ci.sh.
# Every published image carries its exact tag (catalytix.tag) and source commit (org.opencontainers.image.revision);
# the release is created for exactly that commit, with update.sh/docker-compose.yml/.env.example from the image.
name: Build

# CI minutes (private repository): no run on push to main. Each pull request is checked merged into main as it was
# at that moment; main itself is checked again in full when publishing (build, tests, start, Trivy of exactly the
# images that are published) – nothing untested is ever published. The check job skips that part when publishing.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this version (image :<version> and :latest, GitHub release)"
        type: boolean
        default: false

permissions: {}

# Explicit bash: GitHub then runs every step with "bash -eo pipefail" – without it a failing command in a pipe
# (e.g. the tests piped into tee) would go unnoticed.
defaults:
  run:
    shell: bash

# One run per branch and kind of start at a time. Concurrency on the WORKFLOW, not on single jobs: GitHub keeps only
# one waiting entry per group and cancels the older one – at job level that could be the release job of a run whose
# image was already pushed. A run started by hand (publishing) never waits behind or gets replaced by a PR run.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build, test and scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check locks, version numbers and .trivyignore
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: |
          . tools/ci.sh
          python3 tools/lock.py check || fail "Locks incomplete" "See the 'lock check' lines in the log – run tools/lock.py update."
          python3 tools/trivy_scan.py check-ignore
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catalytix/__init__.py)
          grep -q "org.opencontainers.image.version=\"$v\"" Dockerfile || fail "Version mismatch" "Dockerfile label is not $v"
          cv="$(sed -n 's/^ *CATALYTIX_COMPOSE: *"\([0-9]*\)".*/\1/p' docker-compose.yml)"
          grep -q "catalytix.compose=\"$cv\"" Dockerfile || fail "Compose version mismatch" "Dockerfile label catalytix.compose is not $cv"
          new=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$PUBLISH" = true ] && [ "$GITHUB_REF" = refs/heads/main ] \
             && ! release_exists "$v"; then
            highest="$(highest_release)"
            if [ -z "$highest" ] || python3 tools/security_update.py is-highest "$v" "$highest"; then
              new=true
            else
              echo "::warning title=Not published::Version $v is lower than the highest release $highest – nothing is published."
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Version $v – publish now: $new"

      - name: Type check (mypy)
        run: . tools/ci.sh && run_mypy

      - name: Prepare Docker
        if: steps.version.outputs.new != 'true'      # publishing does all of this itself
        run: . tools/ci.sh && prepare_builder

      - name: Build the image (without cache)
        if: steps.version.outputs.new != 'true'      # publishing does all of this itself
        run: |
          . tools/ci.sh
          docker buildx build --no-cache --pull --build-arg "CATALYTIX_REVISION=$GITHUB_SHA" \
            --platform linux/amd64 --load -t catalytix-ci:check . \
            || fail "Image build failed" "See the log of this step."

      - name: Run the tests in the image
        if: steps.version.outputs.new != 'true'      # publishing does all of this itself
        run: . tools/ci.sh && test_in_image catalytix-ci:check "$PWD"

      - name: Start the image like on a server
        if: steps.version.outputs.new != 'true'      # publishing does all of this itself
        run: . tools/ci.sh && start_in_image catalytix-ci:check

      - name: Security scan (Trivy)
        if: steps.version.outputs.new != 'true'      # publishing does all of this itself
        run: |
          python3 tools/trivy_scan.py install
          python3 tools/trivy_scan.py scan catalytix-ci:check

  # Pull requests: arm64 as well, natively and at the same time as the check above (no extra waiting) – an
  # ARM-only problem shows up in the pull request, not only when publishing.
  check-arm64:
    name: Build, test and scan (arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Docker
        run: . tools/ci.sh && prepare_builder

      - name: Build the image (without cache)
        run: |
          . tools/ci.sh
          docker buildx build --no-cache --pull --build-arg "CATALYTIX_REVISION=$GITHUB_SHA" \
            --platform linux/arm64 --load -t catalytix-ci:check . \
            || fail "Image build failed" "See the log of this step."

      - name: Run the tests in the image
        run: . tools/ci.sh && test_in_image catalytix-ci:check "$PWD"

      - name: Start the image like on a server
        run: . tools/ci.sh && start_in_image catalytix-ci:check

      - name: Security scan (Trivy)
        run: |
          python3 tools/trivy_scan.py install
          python3 tools/trivy_scan.py scan catalytix-ci:check

  state:
    name: Already published?
    needs: check
    if: needs.check.outputs.new == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      published: ${{ steps.state.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Already published?
        id: state
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          . tools/ci.sh
          docker_login
          if image_exists "$(image_name):$VERSION"; then
            echo "::notice title=Image already published::$(image_name):$VERSION exists and is never overwritten – only the release is created."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          docker logout ghcr.io >/dev/null

  # Each platform on its own hardware, both at the same time (no emulation – arm64 under QEMU took ~20 minutes):
  # build without cache, tests and start check IN the image, Trivy – then push exactly this image without a tag.
  platform:
    name: Build, check and push (${{ matrix.arch }})
    needs: [check, state]
    if: needs.state.outputs.published == 'false'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Docker
        run: . tools/ci.sh && prepare_builder

      - name: Build (without cache)
        env:
          VERSION: ${{ needs.check.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          . tools/ci.sh
          docker buildx build --no-cache --pull --build-arg "CATALYTIX_TAG=$VERSION" --build-arg "CATALYTIX_REVISION=$GITHUB_SHA" \
            --platform "linux/$ARCH" --load -t "catalytix-ci:$ARCH" . \
            || fail "Image build failed" "See the log of this step – nothing is published."

      - name: Run the tests in the image
        run: . tools/ci.sh && test_in_image "catalytix-ci:${{ matrix.arch }}" "$PWD"

      - name: Start the image like on a server
        run: . tools/ci.sh && start_in_image "catalytix-ci:${{ matrix.arch }}"

      - name: Security scan (Trivy)
        run: |
          python3 tools/trivy_scan.py install
          python3 tools/trivy_scan.py scan "catalytix-ci:${{ matrix.arch }}"

      - name: Push the checked image (without a tag)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          . tools/ci.sh
          docker_login
          mkdir -p digest
          push_by_digest "digest/$ARCH" . --build-arg "CATALYTIX_TAG=$VERSION" --build-arg "CATALYTIX_REVISION=$GITHUB_SHA" \
            --platform "linux/$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest/${{ matrix.arch }}
          retention-days: 1

      - name: Log out
        if: always()
        run: docker logout ghcr.io

  publish:
    name: Publish both platforms
    needs: [check, state, platform]
    # also when the image exists already (platform skipped): then only the release is created
    if: >-
      !cancelled() && needs.state.result == 'success'
      && (needs.platform.result == 'success' || (needs.platform.result == 'skipped' && needs.state.outputs.published == 'true'))
      && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.state.outputs.published == 'false'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: needs.state.outputs.published == 'false'
        with:
          pattern: digest-*
          path: digest
          merge-multiple: true

      - name: Publish
        id: push
        if: needs.state.outputs.published == 'false'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          . tools/ci.sh
          docker_login
          image="$(image_name)"
          ! image_exists "$image:$VERSION" || fail "Version already published" "$image:$VERSION appeared meanwhile – never overwritten."
          merge_platforms digest "$image:$VERSION" "$image:sha-${GITHUB_SHA::7}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          highest="$(highest_release)"
          if [ -z "$highest" ] || python3 tools/security_update.py is-highest "$VERSION" "$highest"; then
            if latest_allows "$VERSION"; then
              docker buildx imagetools create -t "$image:latest" "$image:$VERSION" || fail "Publishing failed" "Could not move :latest."
            else
              echo "::warning title=latest not moved::The tag latest already points to a higher version."
            fi
          fi
          echo "### Published $image:$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout ghcr.io || true

  release:
    name: GitHub release (image files, update.sh, docker-compose.yml)
    needs: [check, publish]
    # explicit: a skipped platform job (image published earlier) would otherwise skip this job as well
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Exactly the published images (pulled back from the registry), for installing without internet:
      # docker load -i catalytix-<version>-<arch>.tar.gz  (or: ./update.sh --load <file>)
      # update.sh, docker-compose.yml and .env.example come from the image itself, and the release points to the
      # commit the image was built from – also when the image was published by an earlier run (no mix of versions).
      - name: Image files and checksums
        id: files
        env:
          PUSHED: ${{ needs.publish.outputs.pushed }}
          VERSION: ${{ needs.check.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . tools/ci.sh
          docker_login
          image="$(image_name)"
          mkdir -p assets
          revision=""
          for arch in amd64 arm64; do
            docker pull -q --platform "linux/$arch" "$image:$VERSION" >/dev/null \
              || fail "Image not available" "Could not pull $image:$VERSION for $arch."
            got="$(docker image inspect -f '{{.Architecture}}' "$image:$VERSION")"
            [ "$got" = "$arch" ] || fail "Wrong platform" "Expected $arch, got $got."
            file="assets/catalytix-$VERSION-$arch.tar.gz"
            # --platform where Docker knows it (containerd image store: otherwise an index with missing platforms)
            docker save --platform "linux/$arch" "$image:$VERSION" 2>/dev/null | gzip -6 > "$file" \
              || docker save "$image:$VERSION" | gzip -6 > "$file"
            # Source commit (the same on both platforms) and the files for the release, from the image itself
            rev="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image:$VERSION")"
            if [ "$arch" = amd64 ]; then
              revision="$rev"
              cid="$(docker create "$image:$VERSION")" || fail "Image not readable" "Could not create a container from $image:$VERSION."
              mkdir -p dist
              docker cp "$cid:/app/dist/." dist/ >/dev/null || fail "Image not readable" "No /app/dist in $image:$VERSION."
              docker rm -f -v "$cid" >/dev/null
            elif [ "$rev" != "$revision" ]; then
              fail "Platforms differ" "amd64 was built from ${revision:-?}, arm64 from ${rev:-?}."
            fi
            docker image rm "$image:$VERSION" >/dev/null
            # Check the file: it must load on its own and be exactly this version and platform
            docker load -q -i "$file" >/dev/null || fail "Image file broken" "$file cannot be loaded."
            v="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}} {{.Architecture}}' "$image:$VERSION")"
            [ "$v" = "$VERSION $arch" ] || fail "Image file wrong" "$file contains $v instead of $VERSION $arch."
            docker image rm "$image:$VERSION" >/dev/null
          done
          docker logout ghcr.io >/dev/null
          if [ -z "$revision" ]; then
            # Images from before 3.0.3 have no revision label: only safe if this run built and pushed it
            [ "$PUSHED" = true ] || fail "Source commit unknown" \
              "$image:$VERSION was published earlier and has no revision label – create release v$VERSION by hand for the commit it was built from."
            revision="$GITHUB_SHA"
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || fail "Source commit unknown" "Invalid revision label: $revision"
          [ "$revision" = "$GITHUB_SHA" ] || echo "::notice title=Release for an earlier commit::$image:$VERSION was built from $revision – the release points there, not to $GITHUB_SHA."
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          for f in update.sh docker-compose.yml .env.example; do
            [ -f "dist/$f" ] || fail "Image incomplete" "$f is missing in /app/dist of $image:$VERSION."
            cp "dist/$f" assets/
          done
          mv assets/.env.example assets/env.example     # release assets cannot start with a dot
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -l assets

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ steps.files.outputs.revision }}
        run: |
          . tools/ci.sh
          if release_exists "$VERSION"; then echo "Release v$VERSION exists already."; exit 0; fi
          cat > notes.md <<EOF
          Installation and updates: see README. In short:
          - New: download docker-compose.yml and env.example (save it as .env), then \`docker compose up -d\`.
          - Update: container manager (Dockhand, Watchtower …), \`docker compose pull && docker compose up -d\`, or \`./update.sh\` (with automatic way back).
          - Without internet: \`./update.sh --load catalytix-$VERSION-amd64.tar.gz\` (arm64 for ARM), checked against SHA256SUMS.
          - Installations from before 3.0.0: run your old \`./update.sh --pull\` once, then \`./update.sh --cleanup\`.

          Changes: see CHANGELOG.en.md (English) or CHANGELOG.md (German).
          EOF
          gh release create "v$VERSION" assets/* \
            --target "$TARGET" \
            --title "Catalytix $VERSION" \
            --notes-file notes.md \
            || fail "Release failed" "Could not create release v$VERSION."
