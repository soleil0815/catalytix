# Catalytix – this file does not need to be edited.
# Your own settings (port, time zone, database …) belong in the .env file
# next to it (template: .env.example). .env is never overwritten by updates.

services:
  catalytix:
    build: .
    # Locally built (update.sh with a zip package) or pulled from GitHub (update.sh --pull, which sets
    # CATALYTIX_IMAGE=ghcr.io/soleil0815/catalytix and CATALYTIX_TAG=latest in .env).
    image: "${CATALYTIX_IMAGE:-catalytix}:${CATALYTIX_TAG:-2.19.0}"
    container_name: catalytix
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"  # nothing in the container can become root again via setuid programs
    ports:
      - "${CATALYTIX_BIND:-0.0.0.0}:${CATALYTIX_PORT:-9300}:9300"   # CATALYTIX_BIND in .env, see README
    volumes:
      - ./data:/data            # database, covers, keys, certificates
    env_file: .env              # must exist (may be empty) – update.sh creates it if needed
    environment:
      TZ: ${TZ:-Europe/Berlin}
    logging:                    # limit the log (max. 3 × 10 MB)
      options:
        max-size: "10m"
        max-file: "3"
