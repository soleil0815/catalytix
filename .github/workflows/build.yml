# Catalytix – tests, container image (GitHub Container Registry) and release zip
#
# push to main with a NEW version number (no release v<version> yet, higher than the latest release)
#                         → tests, image ghcr.io/<owner>/catalytix:<version> + :latest + :sha-<commit>,
#                           then the GitHub release v<version> with catalytix-<version>.zip and .sha256
# push to main, same version → tests and only :sha-<commit> – :latest and :<version> stay untouched, so servers
#                           that follow "latest" never get unreleased commits
# pull request            → tests and a test build of the image (nothing is pushed)
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # publishes only when run on main (see "publish" below)

permissions:
  contents: read

concurrency:      # one run per branch at a time: two pushes never race to create the same release
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the pinned dependencies
        run: |
          python -m pip install pip==26.2.2
          pip install --no-deps --only-binary=:all: -r requirements.txt
          pip check

      - name: Check that all version numbers match
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catalytix/__init__.py)
          grep -q "org.opencontainers.image.version=\"$v\"" Dockerfile || { echo "::error::Dockerfile label is not $v"; exit 1; }
          grep -q "CATALYTIX_TAG:-$v}" docker-compose.yml || { echo "::error::docker-compose.yml default tag is not $v"; exit 1; }

      - name: Run the tests
        working-directory: tests
        run: python -m unittest discover -q

  image:
    name: Container image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      new: ${{ steps.meta.outputs.new }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name, version and what to publish
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          v="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catalytix/__init__.py)"
          publish=false; new=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            publish=true
            latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
            latest="${latest#v}"
            if gh release view "v$v" >/dev/null 2>&1; then
              echo "Release v$v exists – publishing only sha-${GITHUB_SHA::7}."
            elif [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -n1)" != "$v" ]; then
              echo "::warning::Version $v is lower than the latest release $latest – not publishing latest."
            else
              new=true
            fi
          fi
          {
            echo "version=$v"
            echo "publish=$publish"
            echo "new=$new"
            echo "tags<<EOF"
            echo "$image:sha-${GITHUB_SHA::7}"
            if [ "$new" = true ]; then echo "$image:$v"; echo "$image:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release zip
    needs: image
    if: needs.image.outputs.new == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build catalytix-<version>.zip and its checksum
        run: |
          v="${{ needs.image.outputs.version }}"
          git archive --format=zip --prefix=catalytix/ -o "catalytix-$v.zip" HEAD
          sha256sum "catalytix-$v.zip" > "catalytix-$v.zip.sha256"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.image.outputs.version }}"
          gh release view "v$v" >/dev/null 2>&1 && { echo "Release v$v exists already."; exit 0; }
          gh release create "v$v" "catalytix-$v.zip" "catalytix-$v.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Catalytix $v" \
            --notes "Update with the image built by GitHub: \`./update.sh --pull\` – or classically with this package: \`./update.sh catalytix-$v.zip\` (put the .sha256 file next to it). Changes: see CHANGELOG.md."
