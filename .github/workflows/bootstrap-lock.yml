# TEMPORARY – only to create the first hashed locks once (removed again before merging to main).
name: Bootstrap locks
on:
  push:
    branches: [claude/lock-bootstrap]
permissions: {}
jobs:
  lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lock
        run: |
          python3 tools/lock.py update --cooldown-days 7 --report lock-report.json
          python3 tools/lock.py check
          cat lock-report.json
      - name: Commit to this branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile requirements.txt docker/pip.lock
          git commit -q -m "Bootstrap: hashed locks" || exit 0
          git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:claude/lock-bootstrap
